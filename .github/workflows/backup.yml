name: Nightly DB backup

on:
  schedule:
    # 21:00 UTC = 00:00 по Москве
    - cron: '0 21 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Проверка секретов
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Секрет DATABASE_URL не задан — бэкап невозможен"
            exit 1
          fi
          # репозиторий публичный: без шифрования дамп доступен любому — не выгружаем
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Секрет BACKUP_PASSPHRASE не задан — незашифрованный бэкап в публичный репозиторий не выгружаем"
            exit 1
          fi
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::DATABASE_URL не похож на строку подключения (лишние кавычки?)"; exit 1 ;;
          esac
          case "$DATABASE_URL" in
            *localhost*|*127.0.0.1*) echo "::error::DATABASE_URL указывает на localhost — это не Neon"; exit 1 ;;
          esac

      # клиент той же мажорной версии, что сервер Neon (сейчас 18) — иначе pg_dump откажется;
      # бинарь берём по явному пути: системная обёртка может подсунуть старую версию
      - name: Установить postgresql-client-18
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: pg_dump + шифрование
        run: |
          # дамп идёт через прямое подключение: pooled-endpoint (pgbouncer) для pg_dump ненадёжен
          DIRECT_URL="${DATABASE_URL/-pooler/}"
          STAMP="$(date -u +%F)"
          /usr/lib/postgresql/18/bin/pg_dump "$DIRECT_URL" --no-owner --no-privileges \
            | gzip > "vika-salmon-${STAMP}.sql.gz"
          # пустой дамп — признак проблемы, лучше упасть громко
          test "$(gzip -cd vika-salmon-${STAMP}.sql.gz | wc -c)" -gt 10000
          # репозиторий публичный — наружу уходит только шифрованный файл
          gpg --symmetric --batch --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" \
            -o "vika-salmon-${STAMP}.sql.gz.gpg" "vika-salmon-${STAMP}.sql.gz"
          rm "vika-salmon-${STAMP}.sql.gz"
          ls -lah vika-salmon-*.sql.gz.gpg

      - name: Сохранить артефакт (14 дней)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: vika-salmon-*.sql.gz.gpg
          retention-days: 14
          if-no-files-found: error
