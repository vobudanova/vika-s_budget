name: Nightly DB backup

on:
  schedule:
    # 21:00 UTC = 00:00 по Москве
    - cron: '0 21 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Проверка секрета
        if: env.DATABASE_URL == ''
        run: |
          echo "::error::Секрет DATABASE_URL не задан — бэкап невозможен"
          exit 1

      # клиент той же мажорной версии, что сервер Neon — иначе pg_dump откажется
      - name: Установить postgresql-client-17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: pg_dump
        run: |
          # дамп идёт через прямое подключение: pooled-endpoint (pgbouncer) для pg_dump ненадёжен
          DIRECT_URL="${DATABASE_URL/-pooler/}"
          STAMP="$(date -u +%F)"
          pg_dump "$DIRECT_URL" --no-owner --no-privileges | gzip > "vika-salmon-${STAMP}.sql.gz"
          ls -lah vika-salmon-*.sql.gz
          # пустой дамп — признак проблемы, лучше упасть громко
          test "$(gzip -cd vika-salmon-${STAMP}.sql.gz | wc -c)" -gt 10000

      - name: Сохранить артефакт (14 дней)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: vika-salmon-*.sql.gz
          retention-days: 14
          if-no-files-found: error
