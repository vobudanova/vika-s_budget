name: Deploy to Vercel

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  # Идентификаторы проекта (не секретны), токен — в Secrets репозитория
  VERCEL_ORG_ID: team_q2v1xMYpTwQ3pRoOnb3KVX38
  VERCEL_PROJECT_ID: prj_7m43OcarSXqVRQjaKxfnst0WG8pA

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy (build on Vercel)
        run: npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
